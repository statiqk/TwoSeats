<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>document.documentElement.className="checking"</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14151c">
<title>Deux Places · Two Seats</title>
<style>
:root{--bg:#14151c;--gold:#e9a940;--gold2:#f6c26b;--ink:#f3ede0;--mute:#b8b3a7}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:max(24px,env(safe-area-inset-top)) 28px max(96px,calc(env(safe-area-inset-bottom) + 80px));position:relative;overflow:hidden}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 32%,rgba(240,170,60,.20),transparent 60%);pointer-events:none}
main{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;max-width:420px}
.stage{position:relative;width:260px;height:206px;margin-bottom:6px;translate:0 -18px}
.card{position:absolute;left:70px;top:14px;width:120px;height:170px;border-radius:16px;border:2px solid var(--gold);overflow:hidden;background:#222;
 transition:transform 1s cubic-bezier(.5,.1,.2,1),filter 1s,z-index 0s .5s;will-change:transform}
.card svg{width:100%;height:100%;display:block}
.card[data-pos="0"]{transform:rotate(-14deg) translateX(-50px);filter:brightness(.75);z-index:1}
.card[data-pos="1"]{transform:translateY(-6px) scale(1.06);z-index:3}
.card[data-pos="2"]{transform:rotate(14deg) translateX(50px);filter:brightness(.75);z-index:2}
.play{position:absolute;left:50%;top:42%;transform:translate(-40%,-50%);border-left:32px solid rgba(255,255,255,.92);border-top:20px solid transparent;border-bottom:20px solid transparent;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));opacity:0;transition:opacity .6s}
.card[data-pos="1"] .play{opacity:1}
.spark{position:absolute;right:18px;top:-6px;color:var(--gold);font-size:26px;opacity:.8;animation:tw 2.2s ease-in-out infinite}
.stage .card[data-pos="1"]{animation:fl 3.2s ease-in-out infinite}
@keyframes fl{0%,100%{translate:0 0}50%{translate:0 -9px}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(20deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font:600 30px/1.1 Georgia,"Times New Roman",serif;animation:rise .8s .2s both}
h1 small{display:block;font:500 13px Inter,system-ui,sans-serif;letter-spacing:.3em;color:var(--gold);margin-top:8px;text-transform:uppercase}
.badge{display:inline-flex;gap:8px;align-items:center;margin-top:22px;padding:8px 16px;border-radius:99px;border:1px solid rgba(233,169,64,.5);color:var(--gold);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;animation:rise .8s .5s both}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:glow 1.8s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(233,169,64,.5)}50%{box-shadow:0 0 0 7px rgba(233,169,64,0)}}
p.txt{color:var(--mute);font-size:15px;line-height:1.55;margin-top:18px;max-width:310px;animation:rise .8s .8s both}
.bar{width:min(280px,100%);height:8px;border-radius:9px;background:#262733;margin-top:26px;overflow:hidden;animation:rise .6s 1s both}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),#e08f1e);border-radius:9px;transition:width 2.4s cubic-bezier(.2,.7,.2,1) 1.2s}
.pc{font-size:13px;color:#9a958a;margin-top:10px;animation:rise .8s 1.4s both}
footer{position:absolute;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:22px;font-family:"DM Mono","JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase}
.pb{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.08em;color:#8c8798}.pb b{color:#fff;font-weight:600}
.pb img{width:22px;height:22px;border-radius:6px;display:block}
.cp{font-size:9.5px;letter-spacing:.1em;color:#6b6776}
@media(min-width:900px){.stage{transform:scale(1.15)}h1{font-size:38px}p.txt{max-width:460px;font-size:17px}.bar{width:360px}.pb{font-size:16px}.pb img{width:27px;height:27px;border-radius:7px}.cp{font-size:11.5px}}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}h1,.badge,p.txt,.bar,.pc{opacity:1!important}}
.pb b{cursor:default;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;padding:6px 2px;margin:-6px -2px}
body.unlock main{animation:unl .65s ease-in forwards}@keyframes unl{to{opacity:0;transform:scale(1.04)}}
body.unlock .spark{animation-duration:.25s}
html.checking body{visibility:hidden}
</style>
</head>

    if (taps < 3) { if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} } return; }
    taps = 0;
    try { localStorage.setItem(ACCESS_KEY, String(Date.now())); } catch (e) {}
    if (navigator.vibrate) { try { navigator.vibrate([12, 40, 12]); } catch (e) {} }
    document.body.classList.add("unlock");
    setTimeout(function () { location.href = APP_URL; }, reduce ? 0 : 650);
  });

  var cards = [].slice.call(document.querySelectorAll(".card"));
  var pos = [0, 1, 2];
  function apply() { cards.forEach(function (c, i) { c.setAttribute("data-pos", pos[i]); }); }
  apply();
  // Toutes les 3 s, chaque carte avance d'une place (la carte du milieu passe derrière).
  if (!reduce) setInterval(function () { pos = pos.map(function (p) { return (p + 1) % 3; }); apply(); }, 3000);

  // Barre : se remplit de 0 jusqu'à PROGRESS à l'ouverture, puis reste fixe.
  var fill = document.getElementById("fill"), pct = document.getElementById("pct");
  var bar = document.querySelector(".bar");
  bar.setAttribute("aria-valuenow", PROGRESS);
  if (reduce) { fill.style.width = PROGRESS + "%"; pct.textContent = PROGRESS; }
  else {
    pct.textContent = "0";
    requestAnimationFrame(function () { requestAnimationFrame(function () { fill.style.width = PROGRESS + "%"; }); });
    var t0 = null;
    function count(ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min(1, Math.max(0, (ts - t0 - 1200) / 2400));
      pct.textContent = Math.round(PROGRESS * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(count);
    }
    requestAnimationFrame(count);
  }
})();
</script>
</body>
</html>
